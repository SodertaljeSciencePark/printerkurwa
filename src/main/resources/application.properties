spring.application.name=bambukurwa

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prinvue}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging configuration
logging.level.root=INFO
logging.level.nti.te4.printerkurwa=INFO
# Suppress verbose logging from external libraries
logging.level.org.bytedeco=WARN
logging.level.org.bytedeco.javacv=WARN
logging.level.com.hivemq.client=WARN
logging.level.pl.grzeslowski.jbambuapi=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log rotation configuration
logging.file.name=logs/printerkurwa.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-history=7